version: '3.8'

services:
  auth-service:
    build:
      context: ./services/auth-service
    container_name: chsi_auth_service
    restart: unless-stopped
    ports:
      - '5001:5001'
    env_file:
      - ./services/auth-service/.env
    environment:
      - NODE_ENV=production
    networks:
      - chsi-network

  course-service:
    build:
      context: ./services/course-service
    container_name: chsi_course_service
    restart: unless-stopped
    ports:
      - '5002:5002'
    env_file:
      - ./services/course-service/.env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=https://chai-code-puce.vercel.app
    networks:
      - chsi-network

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: chsi_api_gateway
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - TARGET_AUTH=https://chaicode-3.onrender.com
      - TARGET_COURSE=https://chaicode-5.onrender.com
      - NODE_ENV=production
    depends_on:
      - auth-service
      - course-service
    networks:
      - chsi-network

  frontend:
    build:
      context: ./frontend
    container_name: chsi_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - NODE_ENV=production
      - REACT_APP_API_URL=https://chaicode-4.onrender.com
    depends_on:
      - api-gateway
    networks:
      - chsi-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  chsi-network:
    driver: bridge