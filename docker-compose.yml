version: '3.8'
 
services:
  auth-service:
    build:
      context: ./services/auth-service
    container_name: chsi_auth_service
    restart: unless-stopped
    ports:
      - '5001:5001'
    env_file:
      - ./services/auth-service/.env
    environment:
      - NODE_ENV=production
    networks:
      - chsi-network
 
  course-service:
    build:
      context: ./services/course-service
    container_name: chsi_course_service
    restart: unless-stopped
    ports:
      - '5002:5002'
    env_file:
      - ./services/course-service/.env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=https://chai-code-puce.vercel.app
      - CHATBOT_SERVICE_URL=http://chatbot-service:5003
    networks:
      - chsi-network
 
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: chsi_api_gateway
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - TARGET_AUTH=http://auth-service:5001
      - TARGET_COURSE=http://course-service:5002
      - TARGET_CHATBOT=http://chatbot-service:5003
      - NODE_ENV=production
    depends_on:
      - auth-service
      - course-service
      - chatbot-service
    networks:
      - chsi-network
 
  frontend:
    build:
      context: ./frontend
    container_name: chsi_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    networks:
      - chsi-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
 
  chatbot-service:
    build:
      context: ./services/chatbot-service
    container_name: chsi_chatbot_service
    restart: unless-stopped
    ports:
      - '5003:5003'
    environment:
      - PORT=5003
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - NODE_ENV=production
    depends_on:
      - qdrant
    networks:
      - chsi-network
 
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chsi_qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - chsi-network
 
networks:
  chsi-network:
    driver: bridge
 
volumes:
  qdrant_data: